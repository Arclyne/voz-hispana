# Configuración de Moonwave — documentación técnica de Voz Hispana
#
# La documentación está escrita en español, igual que los comentarios del código.
#
# El sitio tiene dos capas:
#   * docs/   — documentación conceptual de ingeniería (Markdown + Mermaid)
#   * /api/   — referencia de API extraída de los comentarios `--[=[ ... ]=]` en src/
#
# `build` y `dev` necesitan las mismas rutas --code que usa el workflow; ver
# DOC_CODE_PATHS en .github/workflows/docs.yml y la nota de más abajo.
#
#   npx moonwave build --code src/ReplicatedStorage \
#                             src/ServerStorage/TemplatesTesting/Core/ServerStorage
#
# `--code src` a secas NO funciona: el extractor aborta por comentarios que ya
# existían en otras partes del árbol.

title = "Voz Hispana"
gitRepoUrl = "https://github.com/arclyne/voz-hispana"
gitSourceBranch = "main"

# La referencia de API está acotada: el workflow pasa rutas `--code` concretas en
# vez de todo `src/`, porque el extractor de Moonwave aborta por comentarios `---`
# preexistentes en otras zonas del árbol. El motivo y las rutas actuales están en
# .github/workflows/docs.yml (DOC_CODE_PATHS).

# `classOrder` agrupa la barra lateral por sistema en vez de alfabéticamente.
#
# CUIDADO: nombrar aquí una clase que no exista rompe el build. Cada nombre de
# esta lista tiene que corresponder a una anotación `@class` real dentro de las
# rutas DOC_CODE_PATHS del workflow. Si añades o quitas una clase, actualiza esto
# a la vez.
#
# Para comprobarlo antes de subir nada:
#   grep -rh '@class ' src/ReplicatedStorage \
#       src/ServerStorage/TemplatesTesting/Core/ServerStorage --include='*.luau'
#
# El bloque de DataKit es aparte a propósito: es un paquete externo instalado con
# wally que trae su propia documentación, escrita por sus autores. Este proyecto
# no la toca. Ver docs/architecture/persistence.md.

[[classOrder]]
section = "Arranque"
classes = ["InitAfterTemplates", "PlayerInit"]

[[classOrder]]
section = "Datos del jugador"
classes = ["PlayerDataService", "PlayerSchema", "Profiles"]

[[classOrder]]
section = "Mundos y casas"
classes = ["ServerPresence"]

[[classOrder]]
section = "Roles y monetización"
classes = ["RoleService", "GamePassService"]

[[classOrder]]
section = "DataKit (paquete externo)"
classes = [
    "DataKit",
    "Profile",
    "Store",
    "BaseStore",
    "Lease",
    "Mutex",
    "Health",
    "Inbox",
    "Signal",
    "Adapters",
    "Types",
    "Util",
    "capitalize",
]

[home]
enabled = true
includeReadme = false

[[home.features]]
title = "Arquitectura"
description = "Cómo arranca un servidor, cómo se importan las plantillas y cómo se inicializan jugadores y personajes."

[[home.features]]
title = "Sistemas"
description = "Casas y servidores reservados, persistencia, red y los sistemas de juego construidos encima."

[[home.features]]
title = "Verificación"
description = "Inconsistencias registradas, la teoría detrás de cada una y un plan reproducible para confirmarla o descartarla."

[docusaurus]
title = "Voz Hispana"
tagline = "Documentación técnica"
url = "https://arclyne.github.io"
baseUrl = "/voz-hispana/"
onBrokenLinks = "throw"

# El sitio está en español: esto traduce también las cadenas del tema
# (Anterior/Siguiente, buscador, «En esta página», etc.).
[docusaurus.i18n]
defaultLocale = "es"
locales = ["es"]

# Mermaid rendering is NOT configured here on purpose.
#
# Moonwave 1.4.2 generates its Docusaurus project from a fixed template whose
# package.json does not include @docusaurus/theme-mermaid, and the cached project
# is wiped whenever that package.json changes. Declaring the theme here would
# therefore fail the build with "module not found".
#
# The Documentation workflow installs the theme into Moonwave's cached project and
# injects `themes` + `markdown.mermaid` into a throwaway copy of this file. If that
# install fails the workflow only warns, and the ```mermaid blocks degrade to code
# blocks instead of failing the build. They still render natively when the Markdown
# is read on GitHub.

[navbar]
title = "Voz Hispana"

[[navbar.items]]
to = "docs/intro"
label = "Documentación"
position = "left"

[[navbar.items]]
to = "api/"
label = "Referencia de API"
position = "left"

[[navbar.items]]
href = "https://github.com/arclyne/voz-hispana"
label = "GitHub"
position = "right"

[footer]
style = "dark"
copyright = "Voz Hispana — documentación de ingeniería generada con Moonwave."
